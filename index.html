<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AIDraxion İndir</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #0f0c1b;
            color: #ffffff;
            height: 100vh;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
        }

        /* Arka plan hareketli noktalar için canvas */
        #bgCanvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }

        /* Ana İçerik Kutusu */
        .container {
            position: relative;
            z-index: 2;
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
        }

        h1 {
            font-size: 3rem;
            font-weight: 700;
            letter-spacing: 2px;
            text-shadow: 0 0 20px rgba(168, 85, 247, 0.5);
        }

        p.subtitle {
            color: #cbd5e1;
            font-size: 1.1rem;
            margin-bottom: 10px;
        }

        /* İndir Butonu */
        .download-btn {
            background: linear-gradient(135deg, #9333ea, #c084fc);
            color: white;
            padding: 18px 45px;
            font-size: 1.5rem;
            font-weight: bold;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 0 30px rgba(147, 51, 234, 0.6);
            transition: all 0.3s ease;
            text-decoration: none;
            display: inline-block;
        }

        .download-btn:hover {
            transform: scale(1.05);
            box-shadow: 0 0 45px rgba(192, 132, 252, 0.9);
            background: linear-gradient(135deg, #a855f7, #d8b4fe);
        }

        /* Sağ Destek Paneli */
        .support-panel {
            position: fixed;
            bottom: 20px;
            right: 20px;
            z-index: 3;
            background: rgba(26, 22, 45, 0.85);
            border: 1px solid rgba(168, 85, 247, 0.3);
            padding: 15px 20px;
            border-radius: 12px;
            backdrop-filter: blur(10px);
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
            max-width: 280px;
            text-align: left;
        }

        .support-panel h3 {
            font-size: 1rem;
            color: #d8b4fe;
            margin-bottom: 5px;
        }

        .support-panel p {
            font-size: 0.85rem;
            color: #94a3b8;
        }
    </style>
</head>
<body>

    <!-- Arka plan noktaları için canvas -->
    <canvas id="bgCanvas"></canvas>

    <!-- Ortadaki Ana Alan -->
    <div class="container">
        <h1>Draxion Launcher</h1>
        <p class="subtitle">En yeni sürümü hemen indir ve keşfetmeye başla.</p>
        
        <!-- AIDraxion-1.0.0-win64.msi --> 
        <a href="AIDraxion-1.0.0-win64.msi" class="download-btn" download>İndir!</a>
    </div>

    <!-- Sağ Alt Destek Paneli -->
    <div class="support-panel">
        <h3>Destek & İletişim</h3>
        <p>Bir sorunla mı karşılaştın? Takıldığın yerde bana yazabilirsin.</p>
    </div>

    <!-- Hareketli Noktalar için JavaScript -->
    <script>
        const canvas = document.getElementById('bgCanvas');
        const ctx = canvas.getContext('2d');

        let width = canvas.width = window.innerWidth;
        let height = canvas.height = window.innerHeight;

        window.addEventListener('resize', () => {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
        });

        const particles = [];
        const particleCount = 60;

        for (let i = 0; i < particleCount; i++) {
            particles.push({
                x: Math.random() * width,
                y: Math.random() * height,
                radius: Math.random() * 2 + 1,
                color: '#a855f7',
                vx: (Math.random() - 0.5) * 0.5,
                vy: (Math.random() - 0.5) * 0.5
            });
        }

        function animate() {
            ctx.fillStyle = '#0f0c1b';
            ctx.fillRect(0, 0, width, height);

            particles.forEach(p => {
                p.x += p.vx;
                p.y += p.vy;

                if (p.x < 0 || p.x > width) p.vx *= -1;
                if (p.y < 0 || p.y > height) p.vy *= -1;

                ctx.beginPath();
                ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
                ctx.fillStyle = p.color;
                ctx.shadowBlur = 10;
                ctx.shadowColor = '#c084fc';
                ctx.fill();
            });

            requestAnimationFrame(animate);
        }

        animate();
    </script>
</body>
</html>
